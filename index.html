<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Билеты</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #181818;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #ff6b35;
    --text: #f0f0f0;
    --muted: #666;
    --correct: #4ade80;
    --wrong: #f87171;
    --selected: #2a2a2a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 20px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .header-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ─── SCREENS ─── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ─── TICKET SELECT ─── */
  #screen-select {
    padding: 60px 40px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .select-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: 4px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .select-heading span { color: var(--accent); }
  .select-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 48px;
  }

  .tickets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px;
    margin-bottom: 40px;
  }
  .ticket-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    padding: 18px 0;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    border-radius: 2px;
  }
  .ticket-btn:hover {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .random-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 18px 48px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .random-btn:hover {
    background: var(--accent2);
    transform: translateY(-2px);
  }
  .random-btn svg { width: 20px; height: 20px; }

  /* ─── QUIZ ─── */
  #screen-quiz {
    padding: 40px;
    max-width: 900px;
    margin: 0 auto;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
    flex-wrap: wrap;
  }
  .quiz-ticket-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 3px;
    color: var(--accent);
  }
  .quiz-progress-wrap {
    flex: 1;
    min-width: 200px;
  }
  .quiz-progress-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .quiz-progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .quiz-progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s;
    border-radius: 2px;
  }
  .back-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 2px;
    letter-spacing: 1px;
  }
  .back-btn:hover { border-color: var(--text); color: var(--text); }

  /* Question */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 36px;
    margin-bottom: 16px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .question-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .question-text {
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 28px;
  }

  /* Answer options */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .option:hover:not(.answered) {
    border-color: #444;
    background: #1a1a1a;
  }
  .option.selected {
    border-color: var(--accent);
    background: rgba(232, 255, 71, 0.06);
  }
  .option.result-correct {
    border-color: var(--correct);
    background: rgba(74, 222, 128, 0.08);
  }
  .option.result-wrong {
    border-color: var(--wrong);
    background: rgba(248, 113, 113, 0.08);
  }
  .option.result-correct-answer {
    border-color: var(--correct);
    background: rgba(74, 222, 128, 0.12);
  }

  .option-letter {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    min-width: 22px;
    transition: color 0.15s;
  }
  .option.selected .option-letter { color: var(--accent); }
  .option.result-correct .option-letter { color: var(--correct); }
  .option.result-wrong .option-letter { color: var(--wrong); }

  .option-content { flex: 1; }
  .option-text { font-size: 15px; line-height: 1.4; }
  .option-img {
    max-width: 100%;
    max-height: 120px;
    object-fit: contain;
    border-radius: 2px;
  }

  .option-mark {
    margin-left: auto;
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .option.selected .option-mark { opacity: 1; color: var(--accent); }
  .option.result-correct .option-mark { opacity: 1; color: var(--correct); }
  .option.result-wrong .option-mark { opacity: 1; color: var(--wrong); }

  /* Navigation between questions */
  .question-nav {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }
  .q-dot {
    width: 32px; height: 32px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 2px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .q-dot:hover { border-color: #444; }
  .q-dot.answered { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.06); }
  .q-dot.current { background: var(--accent); color: #000; border-color: var(--accent); }

  /* Submit */
  .submit-wrap {
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .submit-btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 16px 40px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    opacity: 0.3;
    pointer-events: none;
  }
  .submit-btn.active {
    opacity: 1;
    pointer-events: all;
  }
  .submit-btn.active:hover { background: var(--accent2); transform: translateY(-2px); }
  .submit-hint {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Results */
  #screen-results {
    padding: 60px 40px;
    max-width: 900px;
    margin: 0 auto;
  }
  .results-heading {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }
  .results-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 40px;
  }
  .results-score span {
    color: var(--accent);
    font-size: 20px;
    font-weight: 600;
  }

  .result-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px;
    margin-bottom: 12px;
  }
  .result-item-q {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .result-verdict {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    padding: 6px 12px;
    border-radius: 2px;
    display: inline-block;
  }
  .result-verdict.ok { background: rgba(74,222,128,0.12); color: var(--correct); border: 1px solid rgba(74,222,128,0.3); }
  .result-verdict.fail { background: rgba(248,113,113,0.12); color: var(--wrong); border: 1px solid rgba(248,113,113,0.3); }
  .result-correct-text {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .result-correct-text strong { color: var(--correct); }

  .retry-btn {
    margin-top: 32px;
    background: none;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 14px 36px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    margin-right: 12px;
  }
  .retry-btn:hover { background: var(--accent); color: #000; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">ЭКЗАМЕН</div>
    <div class="header-sub">Система тестирования</div>
  </div>
</div>

<!-- ══════════════════ SCREEN: SELECT ══════════════════ -->
<div id="screen-select" class="screen active">

  <div class="select-sub">// 30 билетов · выбери номер или возьми случайный</div>

    </svg>
    СЛУЧАЙНЫЙ БИЛЕТ
  </button>
</div>

<!-- ══════════════════ SCREEN: QUIZ ══════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="back-btn" onclick="goBack()">← НАЗАД</button>
    <div class="quiz-ticket-label" id="quiz-ticket-label">БИЛЕТ 1</div>

      <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="question-nav" id="question-nav"></div>
  <div id="question-area"></div>

  <div class="submit-wrap">
    <button class="submit-btn" id="submit-btn" onclick="submitQuiz()">СДАТЬ БИЛЕТ</button>
    <div class="submit-hint" id="submit-hint">Ответьте на все вопросы</div>
  </div>
</div>

<!-- ══════════════════ SCREEN: RESULTS ══════════════════ -->
<div id="screen-results" class="screen">
  <div class="results-heading">РЕЗУЛЬТАТ</div>
  <div class="results-score" id="results-score"></div>
  <div id="results-list"></div>
  <div>
    <button class="retry-btn" onclick="retryTicket()">ПЕРЕСДАТЬ</button>
    <button class="retry-btn" onclick="goBack()">← К БИЛЕТАМ</button>
  </div>
</div>

//  ЛОГИКА
// ══════════════════════════════════════════════════════════════════

let currentTicket = null;
let currentQuestionIndex = 0;
let userAnswers = {};    // { questionIdx: optionIdx (в shuffled порядке) }
let shuffledOptions = []; // shuffledOptions[qIdx] = массив { text, correct, origIdx }

const letters = ['А', 'Б', 'В', 'Г'];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Build ticket grid
function buildGrid() {
  const grid = document.getElementById('tickets-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= 30; i++) {
    const btn = document.createElement('button');
    btn.className = 'ticket-btn';
    btn.textContent = i;
    btn.onclick = () => startTicket(i);
    grid.appendChild(btn);
  }
}

function startRandom() {
  startTicket(Math.floor(Math.random() * 30) + 1);
}

function startTicket(num) {
  currentTicket = num;
  currentQuestionIndex = 0;
  userAnswers = {};
  const questions = tickets[num];

  // Shuffle options for each question
  shuffledOptions = questions.map((q, qi) => {
    return shuffle(q.options.map((o, oi) => ({ ...o, origIdx: oi })));
  });

  showScreen('quiz');
  document.getElementById('quiz-ticket-label').textContent = `БИЛЕТ ${num}`;
  renderQuizNav();
  renderQuestion(0);
  updateProgress();
}

function renderQuizNav() {
  const nav = document.getElementById('question-nav');
  const questions = tickets[currentTicket];
  nav.innerHTML = '';
  questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (userAnswers[i] !== undefined ? ' answered' : '') + (i === currentQuestionIndex ? ' current' : '');
    dot.textContent = i + 1;
    dot.onclick = () => { currentQuestionIndex = i; renderQuestion(i); renderQuizNav(); };
    nav.appendChild(dot);
  });
}

function renderQuestion(qi) {
  const q = tickets[currentTicket][qi];
  const opts = shuffledOptions[qi];
  const area = document.getElementById('question-area');

  const answered = userAnswers[qi] !== undefined;

  area.innerHTML = `
    <div class="question-card" id="qcard-${qi}">
      <div class="question-num">ВОПРОС ${qi + 1} / ${tickets[currentTicket].length}</div>
      <div class="question-text">${q.question}</div>
      <div class="options-list" id="options-list"></div>
    </div>
  `;

  const list = document.getElementById('options-list');
  opts.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option' + (userAnswers[qi] === i ? ' selected' : '');
    div.onclick = () => selectOption(qi, i);

    let contentHtml = '';
    if (q.answerType === 'image') {
      const base = `questions/${currentTicket}_${qi + 1}_${opt.origIdx + 1}`;
      const imgId = `img_q${qi}_o${i}`;
      contentHtml = `<img id="${imgId}" class="option-img" src="" alt="Вариант ${letters[i]}" style="display:none"><span id="${imgId}_err" style="font-family:IBM Plex Mono,monospace;font-size:12px;color:#666;display:none">[изображение не найдено]</span>`;
      const _id = imgId; const _base = base; setTimeout(() => loadImg(_id, _base), 0);
    } else {
      contentHtml = `<span class="option-text">${opt.text}</span>`;
    }

    div.innerHTML = `
      <span class="option-letter">${letters[i]}</span>
      <div class="option-content">${contentHtml}</div>
      <span class="option-mark">✓</span>
    `;
    list.appendChild(div);
  });
}

function loadImg(imgId, base) {
  const extensions = ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG'];
  const img = document.getElementById(imgId);
  const err = document.getElementById(imgId + '_err');
  if (!img) return;
  let idx = 0;
  function tryNext() {
    if (idx >= extensions.length) {
      if (err) err.style.display = '';
      return;
    }
    const src = base + '.' + extensions[idx++];
    const probe = new Image();
    probe.onload = () => { img.src = src; img.style.display = ''; };
    probe.onerror = tryNext;
    probe.src = src;
  }
  tryNext();
}

function selectOption(qi, optIdx) {
  // Don't allow changing after submit
  if (document.querySelector('.option.result-correct, .option.result-wrong')) return;
  userAnswers[qi] = optIdx;
  renderQuestion(qi);
  renderQuizNav();
  updateProgress();
}

function updateProgress() {
  const total = tickets[currentTicket].length;
  const answered = Object.keys(userAnswers).length;
  document.getElementById('quiz-progress-text').textContent = `${answered} / ${total} ОТВЕЧЕНО`;
  document.getElementById('quiz-progress-fill').style.width = `${(answered / total) * 100}%`;

  const btn = document.getElementById('submit-btn');
  const hint = document.getElementById('submit-hint');
  if (answered === total) {
    btn.classList.add('active');
    hint.textContent = 'Готово к сдаче!';
  } else {
    btn.classList.remove('active');
    hint.textContent = `Осталось: ${total - answered} вопр.`;
  }
}

function submitQuiz() {
  showScreen('results');
  const questions = tickets[currentTicket];
  let correct = 0;

  const list = document.getElementById('results-list');
  list.innerHTML = '';

  questions.forEach((q, qi) => {
    const opts = shuffledOptions[qi];
    const selectedShuffledIdx = userAnswers[qi];
    const selectedOpt = opts[selectedShuffledIdx];
    const isCorrect = selectedOpt && selectedOpt.correct;
    if (isCorrect) correct++;

    const correctShuffledIdx = opts.findIndex(o => o.correct);
    const correctLetter = letters[correctShuffledIdx];

    let selectedLabel = '';
    if (q.answerType === 'text' && selectedOpt) {
      selectedLabel = `«${selectedOpt.text}»`;
    } else {
      selectedLabel = `вариант ${letters[selectedShuffledIdx]}`;
    }

    let correctLabel = '';
    if (q.answerType === 'text') {
      const correctOpt = opts.find(o => o.correct);
      correctLabel = `вариант ${correctLetter} — «${correctOpt.text}»`;
    } else {
      correctLabel = `вариант ${correctLetter}`;
    }

    const item = document.createElement('div');
    item.className = 'result-item';
    item.innerHTML = `
      <div class="result-item-q">Вопрос ${qi + 1}: ${q.question}</div>
      <div class="result-verdict ${isCorrect ? 'ok' : 'fail'}">
        ${isCorrect ? '✓ ПРАВИЛЬНО' : '✗ НЕПРАВИЛЬНО'}
      </div>
      ${!isCorrect ? `<div class="result-correct-text">Правильный ответ: <strong>${correctLabel}</strong></div>` : ''}
    `;
    list.appendChild(item);
  });

  const pct = Math.round((correct / questions.length) * 100);
  document.getElementById('results-score').innerHTML =
    `Билет ${currentTicket} &nbsp;·&nbsp; Правильных: <span>${correct} / ${questions.length}</span> &nbsp;·&nbsp; ${pct}%`;
  document.getElementById('results-heading') && (document.getElementById('results-heading').textContent = pct >= 60 ? 'СДАНО' : 'НЕ СДАНО');
}

function retryTicket() {
  startTicket(currentTicket);
}

function goBack() {
  showScreen('select');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  window.scrollTo(0, 0);
}

// Init
buildGrid();
</script>
